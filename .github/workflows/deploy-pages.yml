name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v1
        with:
          path: |
            .
          exclude: |
            .git
            .github
            node_modules
            package-lock.json
            package.json
            update_pages.ps1

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1
